    <style>
      :root {
        color-scheme: light;
        --ink: #34221f;
        --soft-ink: #755d58;
        --paper: #fffdfa;
        --peach: #ffd9c7;
        --rose: #ff7fa3;
        --mint: #aeeedb;
        --sky: #bddfff;
        --honey: #ffcf5a;
        --lavender: #d7c7ff;
        --berry: #8f4c6f;
        --line: rgba(52, 34, 31, 0.14);
        --shadow: 0 20px 60px rgba(101, 56, 49, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          ui-rounded, "SF Pro Rounded", "Aptos", "Segoe UI", system-ui,
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 16% 18%, rgba(255, 207, 90, 0.6), transparent 26%),
          radial-gradient(circle at 84% 16%, rgba(174, 238, 219, 0.72), transparent 28%),
          radial-gradient(circle at 72% 86%, rgba(215, 199, 255, 0.72), transparent 30%),
          linear-gradient(135deg, #fff1e8 0%, #ffe2ee 34%, #e4f5ff 68%, #fff6cf 100%);
        display: grid;
        place-items: center;
        padding: 22px;
        overflow-x: hidden;
      }

      .heart-field {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
      }

      .heart-field span {
        position: absolute;
        bottom: -42px;
        color: rgba(143, 76, 111, 0.24);
        font-size: var(--size);
        line-height: 1;
        opacity: 0;
        animation: driftHeart var(--speed) linear infinite;
        animation-delay: var(--delay);
      }

      .heart-field span:nth-child(1) {
        left: 8%;
        --size: 18px;
        --speed: 14s;
        --delay: -2s;
      }

      .heart-field span:nth-child(2) {
        left: 22%;
        --size: 12px;
        --speed: 18s;
        --delay: -8s;
      }

      .heart-field span:nth-child(3) {
        left: 48%;
        --size: 16px;
        --speed: 16s;
        --delay: -5s;
      }

      .heart-field span:nth-child(4) {
        left: 72%;
        --size: 14px;
        --speed: 20s;
        --delay: -10s;
      }

      .heart-field span:nth-child(5) {
        left: 88%;
        --size: 20px;
        --speed: 17s;
        --delay: -3s;
      }

      .heart-field span:nth-child(6) {
        left: 34%;
        --size: 10px;
        --speed: 22s;
        --delay: -13s;
      }

      .music-widget {
        position: fixed;
        left: 14px;
        top: 14px;
        z-index: 3;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: start;
        gap: 8px;
        width: min(calc(100vw - 28px), 360px);
        pointer-events: none;
      }

      .music-toggle {
        width: 44px;
        height: 44px;
        border: 1px solid rgba(143, 76, 111, 0.16);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.78);
        color: var(--berry);
        font: inherit;
        font-size: 23px;
        font-weight: 900;
        box-shadow: 0 10px 24px rgba(143, 76, 111, 0.14);
        cursor: pointer;
        pointer-events: auto;
        transition: transform 180ms ease, background 220ms ease, color 220ms ease;
      }

      .music-toggle:active {
        transform: translateY(2px) scale(0.98);
      }

      .music-widget.is-playing .music-toggle {
        border-color: rgba(255, 120, 150, 0.3);
        background: linear-gradient(135deg, #ff7896, #ffd45c 55%, #aeeedb);
        color: #fff;
        animation: musicPulse 1.9s ease-in-out infinite;
      }

      .music-panel {
        max-width: 0;
        max-height: 0;
        opacity: 0;
        overflow: hidden;
        pointer-events: none;
        transform: translateY(4px);
        transition:
          max-width 420ms ease,
          max-height 420ms ease,
          opacity 260ms ease,
          transform 420ms cubic-bezier(0.2, 0.8, 0.25, 1);
      }

      .music-widget.is-expanded .music-panel {
        max-width: 300px;
        max-height: 188px;
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0);
      }

      .music-line {
        min-height: 38px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        border: 1px solid rgba(143, 76, 111, 0.14);
        border-radius: 15px;
        background: rgba(255, 255, 255, 0.82);
        color: var(--ink);
        box-shadow: 0 10px 24px rgba(143, 76, 111, 0.1);
      }

      .music-status {
        flex: 0 0 auto;
        color: #ff658d;
        font-size: 12px;
        font-weight: 950;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .music-title {
        min-width: 0;
        overflow: hidden;
        color: var(--soft-ink);
        font-size: 12px;
        font-weight: 850;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .music-wave {
        display: flex;
        align-items: end;
        gap: 3px;
        height: 18px;
        margin: 7px 0 0 10px;
      }

      .music-wave span {
        width: 4px;
        height: 8px;
        border-radius: 999px;
        background: #ff7896;
        opacity: 0.72;
        animation: waveBeat 920ms ease-in-out infinite;
      }

      .music-wave span:nth-child(2) {
        height: 14px;
        animation-delay: 110ms;
      }

      .music-wave span:nth-child(3) {
        height: 10px;
        animation-delay: 220ms;
      }

      .music-wave span:nth-child(4) {
        height: 16px;
        animation-delay: 330ms;
      }

      .music-widget:not(.is-playing) .music-wave span {
        animation-play-state: paused;
        opacity: 0.28;
      }

      .song-picker {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
        gap: 6px;
        margin-top: 8px;
      }

      .song-choice,
      .song-lock {
        min-height: 32px;
        border: 1px solid rgba(143, 76, 111, 0.14);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--soft-ink);
        font: inherit;
        font-size: 11px;
        font-weight: 900;
        cursor: pointer;
      }

      .song-choice.is-active,
      .song-lock.is-locked {
        border-color: rgba(255, 120, 150, 0.28);
        background: rgba(255, 232, 240, 0.92);
        color: #9c3f61;
      }

      .song-lock {
        width: 38px;
        font-size: 15px;
      }

      .phone {
        width: min(100%, 430px);
        min-height: min(760px, calc(100vh - 44px));
        border: 1px solid rgba(255, 255, 255, 0.72);
        background:
          linear-gradient(180deg, rgba(255, 253, 250, 0.92), rgba(255, 247, 250, 0.86)),
          rgba(255, 253, 250, 0.86);
        border-radius: 28px;
        box-shadow: var(--shadow);
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr auto;
        backdrop-filter: blur(18px);
        position: relative;
        z-index: 1;
      }

      header {
        padding: 30px 22px 18px;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 8px;
        color: var(--berry);
        font-size: 13px;
        font-weight: 750;
        letter-spacing: 0;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 auto;
        font-size: clamp(32px, 10vw, 46px);
        line-height: 1;
        letter-spacing: 0;
        text-shadow: 0 4px 0 rgba(255, 207, 90, 0.28);
        max-width: 10ch;
      }

      h1 span {
        display: block;
      }

      main {
        padding: 0 22px 22px;
        display: grid;
        align-content: center;
        gap: 18px;
      }

      .envelope-wrap {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 250px;
      }

      .envelope-wrap::before {
        content: "";
        position: absolute;
        width: min(86%, 330px);
        height: 24px;
        bottom: 20px;
        border-radius: 999px;
        background: rgba(143, 76, 111, 0.13);
        filter: blur(10px);
      }

      .envelope {
        position: relative;
        width: min(100%, 320px);
        aspect-ratio: 1.42;
        border: 0;
        border-radius: 22px;
        background:
          linear-gradient(160deg, rgba(255, 255, 255, 0.34), transparent 38%),
          linear-gradient(160deg, #ffd6c7, #fff1df 58%, #ffe0ed);
        box-shadow:
          0 22px 42px rgba(149, 75, 89, 0.22),
          inset 0 0 0 1px rgba(255, 255, 255, 0.62);
        cursor: pointer;
        transform: translateY(0);
        transition: transform 240ms ease, box-shadow 240ms ease, opacity 240ms ease;
      }

      .envelope:active {
        transform: translateY(3px) scale(0.99);
      }

      .envelope::before,
      .envelope::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 18px;
        pointer-events: none;
      }

      .envelope::before {
        background:
          linear-gradient(145deg, transparent 49.4%, rgba(143, 76, 111, 0.2) 50%, transparent 50.8%),
          linear-gradient(35deg, transparent 49.4%, rgba(143, 76, 111, 0.2) 50%, transparent 50.8%),
          linear-gradient(to top, rgba(255, 127, 163, 0.26), transparent 54%);
      }

      .envelope::after {
        clip-path: polygon(0 0, 100% 0, 50% 62%);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.3), transparent 38%),
          linear-gradient(180deg, #ffbfd4, #ffcfc1);
        transform-origin: top;
        transition: transform 980ms cubic-bezier(0.16, 0.86, 0.28, 1.04) 420ms;
      }

      .seal {
        position: absolute;
        left: 50%;
        top: 54%;
        z-index: 3;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 35% 28%, rgba(255, 255, 255, 0.46), transparent 24%),
          linear-gradient(145deg, #ff7096, #c95b84);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 30px;
        line-height: 1;
        box-shadow:
          0 10px 18px rgba(143, 76, 111, 0.24),
          inset 0 -3px 0 rgba(52, 34, 31, 0.12);
        transform: translate(-50%, -50%) rotate(-8deg);
        transition: transform 420ms ease, opacity 260ms ease;
      }

      .ribbon {
        position: absolute;
        inset: 0;
        z-index: 2;
        border-radius: 22px;
        background:
          linear-gradient(to right, transparent calc(50% - 11px), rgba(255, 246, 190, 0.78) calc(50% - 10px), rgba(255, 246, 190, 0.78) calc(50% + 10px), transparent calc(50% + 11px)),
          linear-gradient(to bottom, transparent calc(50% - 10px), rgba(255, 246, 190, 0.7) calc(50% - 9px), rgba(255, 246, 190, 0.7) calc(50% + 9px), transparent calc(50% + 10px));
        pointer-events: none;
        transition: opacity 520ms ease 260ms;
      }

      .note {
        position: absolute;
        left: 8%;
        right: 8%;
        bottom: 18%;
        min-height: 64%;
        padding: 18px;
        border-radius: 16px;
        background:
          repeating-linear-gradient(
            to bottom,
            #fffdfa 0,
            #fffdfa 28px,
            rgba(255, 207, 90, 0.28) 29px
          ),
          linear-gradient(135deg, rgba(255, 255, 255, 0.5), transparent);
        border: 1px solid rgba(143, 76, 111, 0.12);
        box-shadow: 0 12px 30px rgba(52, 34, 31, 0.13);
        display: grid;
        place-items: center;
        text-align: center;
        font-weight: 850;
        line-height: 1.2;
        transform: translateY(56px);
        opacity: 0;
        transition:
          transform 980ms cubic-bezier(0.16, 0.86, 0.28, 1.04) 520ms,
          opacity 520ms ease 740ms;
      }

      .envelope.open::after {
        transform: rotateX(172deg);
      }

      .envelope.open .note {
        transform: translateY(-38px);
        opacity: 1;
      }

      .envelope.open .seal {
        opacity: 0;
        transform: translate(-50%, -50%) rotate(20deg) scale(0.72);
        transition-delay: 240ms;
      }

      .envelope.open .ribbon {
        opacity: 0;
      }

      .envelope.fly-away {
        animation: flyAway 680ms ease-in forwards;
      }

      .envelope.ready {
        animation: floatIn 720ms cubic-bezier(0.2, 0.8, 0.25, 1) forwards;
      }

      .envelope.open {
        animation: unwrap 1280ms ease both;
      }

      .sparkles {
        position: absolute;
        inset: -18px;
        pointer-events: none;
      }

      .sparkles span {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--honey);
        opacity: 0;
        transform: scale(0.4);
      }

      .envelope.open .sparkles span {
        animation: pop 1200ms ease 700ms forwards;
      }

      .sparkles span:nth-child(1) {
        left: 4%;
        top: 20%;
      }

      .sparkles span:nth-child(2) {
        right: 7%;
        top: 9%;
        background: var(--mint);
        animation-delay: 80ms;
      }

      .sparkles span:nth-child(3) {
        left: 16%;
        bottom: 7%;
        background: var(--rose);
        animation-delay: 140ms;
      }

      .sparkles span:nth-child(4) {
        right: 18%;
        bottom: 16%;
        background: var(--sky);
        animation-delay: 200ms;
      }

      @keyframes pop {
        0% {
          opacity: 0;
          transform: translateY(8px) scale(0.4);
        }
        55% {
          opacity: 1;
          transform: translateY(-10px) scale(1);
        }
        100% {
          opacity: 0;
          transform: translateY(-26px) scale(0.5);
        }
      }

      @keyframes unwrap {
        0% {
          transform: translateY(0) rotate(0deg) scale(1);
        }
        18% {
          transform: translateY(-2px) rotate(-1.8deg) scale(1.015);
        }
        36% {
          transform: translateY(1px) rotate(1.2deg) scale(1.01);
        }
        62% {
          transform: translateY(-4px) rotate(0deg) scale(1.02);
        }
        100% {
          transform: translateY(0) rotate(0deg) scale(1);
        }
      }

      @keyframes driftHeart {
        0% {
          opacity: 0;
          transform: translate3d(0, 0, 0) rotate(0deg) scale(0.82);
        }
        16% {
          opacity: 0.62;
        }
        82% {
          opacity: 0.34;
        }
        100% {
          opacity: 0;
          transform: translate3d(32px, -112vh, 0) rotate(28deg) scale(1.18);
        }
      }

      @keyframes musicPulse {
        0%,
        100% {
          transform: translateY(0) scale(1);
          box-shadow: 0 10px 24px rgba(143, 76, 111, 0.14);
        }
        50% {
          transform: translateY(-2px) scale(1.06);
          box-shadow: 0 14px 30px rgba(255, 120, 150, 0.28);
        }
      }

      @keyframes waveBeat {
        0%,
        100% {
          transform: scaleY(0.62);
        }
        50% {
          transform: scaleY(1.15);
        }
      }

      @keyframes flyAway {
        0% {
          opacity: 1;
          transform: translateY(0) rotate(0deg) scale(1);
        }
        55% {
          opacity: 1;
          transform: translate(28px, -42px) rotate(8deg) scale(0.96);
        }
        100% {
          opacity: 0;
          transform: translate(180px, -120px) rotate(18deg) scale(0.72);
        }
      }

      @keyframes floatIn {
        0% {
          opacity: 0;
          transform: translate(-90px, 34px) rotate(-10deg) scale(0.88);
        }
        100% {
          opacity: 1;
          transform: translateY(0) rotate(0deg) scale(1);
        }
      }

      .primary {
        width: 100%;
        min-height: 56px;
        border: 0;
        border-radius: 16px;
        background: linear-gradient(135deg, #34221f, #8f4c6f);
        color: #fff;
        font: inherit;
        font-size: 17px;
        font-weight: 850;
        cursor: pointer;
        box-shadow: 0 14px 30px rgba(143, 76, 111, 0.24);
      }

      .primary:active {
        transform: translateY(2px);
      }

      .message {
        display: grid;
        gap: 14px;
        animation: riseIn 340ms ease both;
      }

      .daily-overview {
        display: grid;
        gap: 14px;
        margin-bottom: 2px;
      }

      .pill-row {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 0;
        overflow: hidden;
        border: 1px solid rgba(143, 76, 111, 0.13);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.68);
        box-shadow: 0 10px 28px rgba(143, 76, 111, 0.08);
      }

      .pill,
      .card {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.74);
        box-shadow: 0 8px 22px rgba(143, 76, 111, 0.08);
      }

      .pill {
        min-height: 102px;
        padding: 14px 15px;
        display: grid;
        align-content: start;
        gap: 9px;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }

      .pill + .pill {
        border-left: 1px solid rgba(143, 76, 111, 0.11);
      }

      .pill-heading {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 8px;
      }

      .status-icon,
      .info-symbol,
      .weather-mini-symbol {
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        color: #fff;
        box-shadow: 0 6px 14px rgba(89, 67, 75, 0.12);
      }

      .status-icon {
        width: 29px;
        height: 29px;
        border-radius: 10px;
        font-size: 14px;
      }

      .time-icon {
        background: linear-gradient(145deg, #f29bb7, #cf6d92);
      }

      .outside-icon {
        background: linear-gradient(145deg, #f7c765, #e9a64d);
      }

      .label {
        color: var(--soft-ink);
        font-size: 11px;
        font-weight: 850;
        text-transform: uppercase;
        letter-spacing: 0;
      }

      .value {
        font-size: 15px;
        font-weight: 850;
        line-height: 1.32;
      }

      .outside-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .unit-switch {
        display: inline-grid;
        grid-template-columns: repeat(2, 1fr);
        padding: 2px;
        border: 1px solid rgba(143, 76, 111, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.7);
      }

      .unit-option {
        min-width: 29px;
        height: 24px;
        padding: 0 6px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--soft-ink);
        font: inherit;
        font-size: 10px;
        font-weight: 900;
        cursor: pointer;
      }

      .unit-option.is-active {
        background: var(--berry);
        color: #fff;
        box-shadow: 0 4px 10px rgba(143, 76, 111, 0.2…25265 tokens truncated…e >= 50) {
          return `The sky is ${summary}. A small rain plan could keep the rest of the day softer.`;
        }
        return `The sky is ${summary}. Nothing dramatic is asking for attention, so take the day gently.`;
      }

      function weatherIconEntity(code) {
        if (code === 0) return "&#9728;";
        if ([1, 2].includes(code)) return "&#9925;";
        if ([3, 45, 48].includes(code)) return "&#9729;";
        if ([51, 53, 55, 56, 57, 61, 63, 80, 81].includes(code)) return "&#9730;";
        if ([65, 66, 67, 82, 95, 96, 99].includes(code)) return "&#9889;";
        if ([71, 73, 75, 77, 85, 86].includes(code)) return "&#10052;";
        return "&#9729;";
      }

      function displayTemperature(celsius) {
        if (!Number.isFinite(Number(celsius))) return "--";
        const value = temperatureUnit === "f" ? (celsius * 9) / 5 + 32 : celsius;
        return `${Math.round(value)}\u00B0${temperatureUnit.toUpperCase()}`;
      }

      function renderDailyAnalysis() {
        if (!currentDailyForecast?.time?.length) return;
        const high = currentDailyForecast.temperature_2m_max?.[0];
        const low = currentDailyForecast.temperature_2m_min?.[0];
        const rain = Math.round(currentDailyForecast.precipitation_probability_max?.[0] ?? 0);
        const wind = Math.round(currentDailyForecast.wind_speed_10m_max?.[0] ?? 0);
        weatherAnalysis.textContent = `Today may reach ${displayTemperature(high)} and settle near ${displayTemperature(low)}. Rain chance: ${rain}%. Strongest wind: about ${wind} km/h.`;
      }

      function renderForecast() {
        if (!currentDailyForecast?.time?.length) return;
        forecastStrip.innerHTML = "";

        currentDailyForecast.time.slice(0, 14).forEach((dateValue, index) => {
          const date = new Date(`${dateValue}T12:00:00`);
          const day = document.createElement("article");
          day.className = "forecast-day";

          const dayName = document.createElement("span");
          dayName.className = "forecast-day-name";
          dayName.textContent = index === 0
            ? "Today"
            : new Intl.DateTimeFormat("en-GB", { weekday: "short", day: "2-digit", month: "short" }).format(date);

          const icon = document.createElement("span");
          icon.className = "forecast-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.innerHTML = weatherIconEntity(currentDailyForecast.weather_code?.[index]);

          const temperatures = document.createElement("span");
          temperatures.className = "forecast-temperatures";
          temperatures.textContent = `${displayTemperature(currentDailyForecast.temperature_2m_max[index])} / ${displayTemperature(currentDailyForecast.temperature_2m_min[index])}`;

          const detail = document.createElement("span");
          detail.className = "forecast-detail";
          const rain = Math.round(currentDailyForecast.precipitation_probability_max?.[index] ?? 0);
          const wind = Math.round(currentDailyForecast.wind_speed_10m_max?.[index] ?? 0);
          detail.textContent = `${summarizeWeather(currentDailyForecast.weather_code?.[index])}. Rain ${rain}% - wind ${wind} km/h.`;

          day.append(dayName, icon, temperatures, detail);
          forecastStrip.appendChild(day);
        });
      }

      function renderHourlyForecast() {
        if (!currentHourlyForecast?.time?.length) return;
        const now = new Date();
        const upcoming = currentHourlyForecast.time
          .map((time, index) => ({ time: new Date(time), index }))
          .filter(({ time }) => time >= new Date(now.getTime() - 30 * 60 * 1000))
          .slice(0, 24);

        hourlyStrip.innerHTML = "";
        if (!upcoming.length) {
          hourlyStrip.innerHTML = '<span class="fuel-note">The next hours are still being updated.</span>';
          return;
        }
        upcoming.forEach(({ time, index }, position) => {
          const hour = document.createElement("article");
          hour.className = "hourly-hour";

          const timeText = document.createElement("span");
          timeText.className = "hourly-time";
          timeText.textContent = position === 0
            ? "Now"
            : new Intl.DateTimeFormat("en-GB", { weekday: "short", hour: "2-digit", minute: "2-digit" }).format(time);

          const icon = document.createElement("span");
          icon.className = "forecast-icon";
          icon.setAttribute("aria-hidden", "true");
          icon.innerHTML = weatherIconEntity(currentHourlyForecast.weather_code?.[index]);

          const temperature = document.createElement("span");
          temperature.className = "hourly-temperature";
          temperature.textContent = displayTemperature(currentHourlyForecast.temperature_2m?.[index]);

          const detail = document.createElement("span");
          detail.className = "hourly-detail";
          const rain = Math.round(currentHourlyForecast.precipitation_probability?.[index] ?? 0);
          const wind = Math.round(currentHourlyForecast.wind_speed_10m?.[index] ?? 0);
          detail.textContent = `Rain ${rain}% - wind ${wind} km/h.`;

          hour.append(timeText, icon, temperature, detail);
          hourlyStrip.appendChild(hour);
        });
      }

      function toggleHourlyForecast() {
        isHourlyOpen = !isHourlyOpen;
        hourlyCard.classList.toggle("is-open", isHourlyOpen);
        hourlyToggle.setAttribute("aria-expanded", String(isHourlyOpen));
        hourlyBody.setAttribute("aria-hidden", String(!isHourlyOpen));
        if (isHourlyOpen) renderHourlyForecast();
      }

      function renderTemperature() {
        temperatureUnitButtons.forEach((button) => {
          const isActive = button.dataset.temperatureUnit === temperatureUnit;
          button.classList.toggle("is-active", isActive);
          button.setAttribute("aria-pressed", String(isActive));
        });

        if (currentTemperatureC === null) return;
        const temperature = temperatureUnit === "f"
          ? Math.round((currentTemperatureC * 9) / 5 + 32)
          : Math.round(currentTemperatureC);
        weatherText.textContent = `${temperature}\u00B0${temperatureUnit.toUpperCase()}, ${currentWeatherSummary}`;
      }

      function setTemperatureUnit(unit) {
        if (unit !== "c" && unit !== "f") return;
        temperatureUnit = unit;
        renderTemperature();
        renderHourlyForecast();
        renderDailyAnalysis();
        renderForecast();
      }

      function preferredCountryCode() {
        const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
        for (const language of languages) {
          try {
            const region = new Intl.Locale(language).region;
            if (region) return region.toUpperCase();
          } catch {
            const match = String(language).match(/[-_]([A-Za-z]{2})$/);
            if (match) return match[1].toUpperCase();
          }
        }
        return "DE";
      }

      function formatFuelPrice(value, currency) {
        try {
          return new Intl.NumberFormat("en", {
            style: "currency",
            currency,
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }).format(value);
        } catch {
          return `${Number(value).toFixed(2)} ${currency}`;
        }
      }

      function renderFuelPrice() {
        const type = fuelTypeSelect.value;
        if (type === "electric") {
          fuelPrice.textContent = "Varies by provider";
          fuelNote.textContent = "Charging prices depend on the station, provider, speed, and personal tariff.";
          fuelMetaText.textContent = "Electric charging is not included in the fuel average. ";
          return;
        }

        const countries = fuelPriceData?.data;
        if (!countries) return;
        const countryEntry = countries[fuelCountryCode] || countries.DE || Object.values(countries)[0];
        if (!countryEntry) {
          fuelPrice.textContent = "No average available";
          fuelNote.textContent = "This fuel type is not listed for the selected country right now.";
          return;
        }

        const value = Number(countryEntry.prices?.[type]);
        if (!Number.isFinite(value)) {
          fuelPrice.textContent = "No average available";
          fuelNote.textContent = "This fuel type is not listed for the selected country right now.";
        } else {
          const unit = String(countryEntry.unit || "litre").toLowerCase().startsWith("l") ? "L" : countryEntry.unit;
          fuelPrice.textContent = `${formatFuelPrice(value, countryEntry.currency || "EUR")} / ${unit}`;
          fuelNote.textContent = "Latest available country average. Individual stations may be higher or lower.";
        }

        let updated = "latest available update";
        const rawUpdated = fuelPriceData.meta?.updated_at;
        if (rawUpdated) {
          const dateOnly = String(rawUpdated).slice(0, 10);
          const parsedDate = new Date(`${dateOnly}T00:00:00Z`);
          if (!Number.isNaN(parsedDate.getTime())) {
            updated = new Intl.DateTimeFormat("en-GB", { dateStyle: "medium", timeZone: "UTC" }).format(parsedDate);
          }
        }
        fuelMetaText.textContent = `${countryEntry.country_name || fuelCountryCode} - updated ${updated}. `;
      }

      async function loadFuelPrices() {
        fuelCountryCode = preferredCountryCode();
        if (fuelTypeSelect.value === "electric") {
          renderFuelPrice();
          return;
        }
        if (fuelPriceData) {
          renderFuelPrice();
          return;
        }

        fuelPrice.textContent = "Checking the latest average...";
        fuelNote.textContent = "This will show a current country average, not a single station price.";
        try {
          const response = await fetch("https://openvan.camp/api/fuel/prices?source=good-mood-to-go");
          if (!response.ok) throw new Error("Fuel data unavailable");
          const data = await response.json();
          if (!data.success || !data.data) throw new Error("Fuel data unavailable");
          fuelPriceData = data;
          renderFuelPrice();
        } catch {
          fuelPrice.textContent = "Price is shy today";
          fuelNote.textContent = "The current average could not load. Please check again a little later.";
          fuelMetaText.textContent = "No price update available. ";
        }
      }

      async function loadWeather() {
        if (!("geolocation" in navigator)) {
          currentTemperatureC = null;
          currentHourlyForecast = null;
          currentDailyForecast = null;
          weatherText.textContent = "location unavailable";
          weatherWarningText.textContent = "No local forecast warning is available without location.";
          weatherDetail.textContent =
            "Weather needs location access, but this phone did not offer it.";
          weatherAnalysis.textContent = "Today's analysis needs location access too.";
          hourlyStrip.innerHTML = '<span class="fuel-note">The hourly forecast needs location access.</span>';
          forecastStrip.innerHTML = '<span class="fuel-note">The 14-day outlook needs location access.</span>';
          return;
        }

        weatherText.textContent = "asking the sky...";
        weatherWarningText.textContent = "Checking the next few hours...";
        weatherDetail.textContent = "Waiting for location so the weather note can be local.";
        weatherAnalysis.textContent = "Gathering the gentler details of today...";
        hourlyStrip.innerHTML = '<span class="fuel-note">Drawing the next 24 hours...</span>';
        forecastStrip.innerHTML = '<span class="fuel-note">Drawing the next 14 days...</span>';

        navigator.geolocation.getCurrentPosition(
          async ({ coords }) => {
            try {
              const params = new URLSearchParams({
                latitude: coords.latitude.toFixed(4),
                longitude: coords.longitude.toFixed(4),
                current: "temperature_2m,weather_code,wind_speed_10m",
                hourly: "temperature_2m,weather_code,precipitation_probability,wind_speed_10m",
                daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max",
                forecast_days: "14",
                timezone: "auto"
              });
              const response = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
              const data = await response.json();
              const current = data.current;
              currentTemperatureC = current.temperature_2m;
              currentWeatherSummary = summarizeWeather(current.weather_code);
              currentHourlyForecast = data.hourly;
              currentDailyForecast = data.daily;
              renderTemperature();
              weatherWarningText.textContent = weatherWarning(current, data.hourly);
              weatherDetail.textContent = gentleWeatherNote(current, data.hourly);
              renderHourlyForecast();
              renderDailyAnalysis();
              renderForecast();
            } catch {
              currentTemperatureC = null;
              currentHourlyForecast = null;
              currentDailyForecast = null;
              weatherText.textContent = "weather shy today";
              weatherWarningText.textContent = "The local forecast warning could not load.";
              weatherDetail.textContent =
                "The weather note could not load, but the care note still counts: food, water, and softness.";
              weatherAnalysis.textContent = "Today's analysis could not load this time.";
              hourlyStrip.innerHTML = '<span class="fuel-note">The hourly forecast is hiding for now.</span>';
              forecastStrip.innerHTML = '<span class="fuel-note">The 14-day outlook is hiding for now.</span>';
            }
          },
          () => {
            currentTemperatureC = null;
            currentHourlyForecast = null;
            currentDailyForecast = null;
            weatherText.textContent = "location not shared";
            weatherWarningText.textContent = "No local forecast warning is available without location.";
            weatherDetail.textContent =
              "No worries. Without location, this still sends love: please eat, drink water, and stay safe.";
            weatherAnalysis.textContent = "No location was shared, so today's analysis will stay private too.";
            hourlyStrip.innerHTML = '<span class="fuel-note">Share location to see the hourly forecast.</span>';
            forecastStrip.innerHTML = '<span class="fuel-note">Share location to see the 14-day outlook.</span>';
          },
          { enableHighAccuracy: false, timeout: 9000, maximumAge: 600000 }
        );
      }

      function openSmile() {
        if (isOpen || isFlying) return;
        isOpen = true;
        const draws = drawLetterCollection();
        switchSongForNewLetter();
        openButton.classList.add("open");
        openButton.classList.remove("ready");
        openButton.setAttribute("aria-label", "Opened tiny smile");
        message.classList.add("hidden");
        noteText.textContent = "A little love note for you.";
        moodButton.textContent = "Close";
        updateTime();
        mainStoryTitle.textContent = draws.main.title;
        mainStoryText.textContent = draws.main.text;
        careText.textContent = draws.care.text;
        factText.textContent = draws.facts.text;
        loveText.textContent = draws["for-you"].text;
        missionText.textContent = draws.missions.text;
        wishText.textContent = draws.wishes.text;
        revealSnakeGifts(draws.snake.text);
        window.clearTimeout(messageTimer);
        messageTimer = window.setTimeout(() => {
          if (isOpen) message.classList.remove("hidden");
        }, 1180);
      }

      function closeSmile() {
        if (!isOpen || isFlying) return;
        isFlying = true;
        isOpen = false;
        window.clearTimeout(messageTimer);
        message.classList.add("hidden");
        hideSnakeGifts();
        moodButton.textContent = "Open another tiny smile";
        openButton.classList.remove("open");
        openButton.classList.add("fly-away");
        openButton.setAttribute("aria-label", "A tiny smile is flying away");

        window.setTimeout(() => {
          openButton.classList.remove("fly-away");
          openButton.classList.add("ready");
          noteText.textContent = "";
          openButton.setAttribute("aria-label", "Open another tiny smile");
          isFlying = false;
        }, 700);
      }

      function handleMainButton() {
        if (isOpen) {
          closeSmile();
        } else {
          openSmile();
        }
      }

      function closeMusicPanelFromOutside(event) {
        if (!isMusicPanelOpen) return;
        if (musicWidget.contains(event.target)) return;
        setMusicPanelOpen(false);
      }

      function closeViewNavFromOutside(event) {
        if (!isViewNavOpen) return;
        if (viewNav.contains(event.target) || viewMenuToggle.contains(event.target)) return;
        setViewNavOpen(false);
      }

      viewMenuToggle.addEventListener("click", () => setViewNavOpen(!isViewNavOpen));
      viewNavClose.addEventListener("click", () => setViewNavOpen(false));
      viewNavBackdrop.addEventListener("click", () => setViewNavOpen(false));
      document.addEventListener("click", closeViewNavFromOutside);
      viewTargetButtons.forEach((button) => {
        button.addEventListener("click", () => showAppView(button.dataset.viewTarget));
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && isViewNavOpen) setViewNavOpen(false);
      });
      openButton.addEventListener("click", openSmile);
      moodButton.addEventListener("click", handleMainButton);
      musicToggle.addEventListener("click", toggleMusic);
      document.addEventListener("click", closeMusicPanelFromOutside);
      collectionToggle.addEventListener("click", toggleCollection);
      snakeCollectionToggle.addEventListener("click", toggleCollection);
      collectionSections.addEventListener("click", toggleCollectionCategory);
      snakeCollectionSections.addEventListener("click", toggleCollectionCategory);
      hourlyToggle.addEventListener("click", toggleHourlyForecast);
      temperatureUnitButtons.forEach((button) => {
        button.addEventListener("click", () => setTemperatureUnit(button.dataset.temperatureUnit));
      });
      fuelTypeSelect.addEventListener("change", () => {
        if (fuelTypeSelect.value === "electric" || fuelPriceData) {
          renderFuelPrice();
        } else {
          loadFuelPrices();
        }
      });
      songChoices.forEach((button) => {
        button.addEventListener("click", () => selectSong(Number(button.dataset.songIndex), true));
      });
      songLock.addEventListener("click", () => {
        isSongLocked = !isSongLocked;
        updateSongControls();
      });
      localSong.addEventListener("play", () => setMusicUi(true));
      localSong.addEventListener("pause", () => setMusicUi(false));
      localSong.addEventListener("ended", () => {
        if (!isSongLocked) {
          moveToNextSong();
        } else {
          localSong.currentTime = 0;
        }
        localSong.play().catch(() => setMusicUi(false));
      });
      snakeFriend.addEventListener("click", triggerSnakeHappy);
      snakeFriend.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          triggerSnakeHappy();
        }
      });
      updateTime();
      loadCurrentSong();
      updateSongControls();
      collectionCounts = loadCollectionCounts();
      renderCollection();
      setInterval(updateTime, 30000);
    </script>
  </body>
</html>
